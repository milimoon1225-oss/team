name: Escritorio Windows
on:
  workflow_dispatch:
  push:
    branches: [feat/escritorio-local]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:desktop
      - run: npm run test:samples
      - run: npm run dist:win
      - run: npm run checksums
      - uses: actions/upload-artifact@v4
        with:
          name: Creativa-Operaciones-Windows
          path: |
            release/*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
