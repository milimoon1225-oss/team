<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Prototipo navegable de la tienda virtual Creativa Impresos. Escenario de demostración.">
  <title>Creativa Impresos · Prototipo</title>
  <style>
    :root{font-family:Arial,sans-serif;color:#14243e;background:#edf1f7;font-synthesis:none;--navy:#101e35;--blue:#175ee9;--muted:#64748b;--border:#dce3ed}
    *{box-sizing:border-box}body{margin:0}button,select{font:inherit}button,select,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:disabled{opacity:.38;cursor:default}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #61c9ff;outline-offset:3px}
    .toolbar{position:sticky;top:0;z-index:20;background:var(--navy);color:white;box-shadow:0 3px 15px #0c1a3020}
    .toolbar-inner{max-width:1600px;margin:auto;padding:13px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:220px}.brand-symbol{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#22d3ee,#245af2);color:#fff;font-size:21px;font-weight:800}.brand-name{font-size:14px;letter-spacing:.15px;font-weight:700}.brand-tag{font-size:10px;letter-spacing:.8px;padding:4px 7px;background:#223451;border:1px solid #3c506f;border-radius:5px;color:#c8d7ec;text-transform:uppercase}
    .device-tabs{display:flex;gap:3px;padding:3px;border-radius:9px;background:#081426}.device-tab{border:0;background:transparent;border-radius:6px;color:#b4c3d8;padding:8px 12px;font-size:12px;font-weight:700;white-space:nowrap}.device-tab[aria-pressed="true"]{background:#fff;color:#16365c;box-shadow:0 1px 4px #0002}.device-tab svg{vertical-align:-2px;margin-right:5px}
    .screen-picker{display:flex;align-items:center;gap:8px}.screen-picker label{font-size:11px;color:#b4c3d8}.screen-picker select{background:#1e2e48;border:1px solid #3c4f6d;border-radius:7px;color:white;padding:8px 29px 8px 10px;max-width:265px;font-size:12px;min-height:35px}
    .toolbar-action{background:transparent;border:1px solid #3c4f6d;color:#e0e9f6;border-radius:7px;padding:8px 10px;font-size:12px;min-height:35px;white-space:nowrap}.toolbar-action:hover:enabled{background:#243955}.actions{display:flex;gap:7px}
    .workspace{max-width:1490px;margin:0 auto;padding:23px 25px 30px}.screen-meta{display:flex;align-items:center;gap:15px;justify-content:space-between;margin-bottom:15px;min-height:30px}.meta-title{margin:0;font-size:14px;font-weight:700;color:#26364d}.meta-caption{font-size:11px;color:var(--muted);margin-top:4px}.hotspots{display:flex;align-items:center;gap:7px;font-size:11px;color:#52647c;cursor:pointer;white-space:nowrap}.hotspots input{accent-color:var(--blue);width:15px;height:15px;margin:0}
    .canvas-shell{margin:0 auto;background:#fff;box-shadow:0 13px 36px #23395413,0 1px 3px #2339540d;outline:1px solid #d7dfeb;border-radius:4px;overflow:hidden;transition:max-width .18s ease}.canvas-shell[data-device="mobile"]{border:7px solid #15243c;border-radius:28px;outline:none;box-shadow:0 20px 50px #20355424}.canvas-svg{display:block;width:100%;height:auto;background:white}.canvas-svg [data-target]{cursor:pointer;outline:none}.canvas-svg [data-target]:focus-visible>.hotspot-outline{opacity:1;fill:#1764ec15;stroke:#1764ec;stroke-width:3}.hotspot-outline{fill:#15a2ff12;stroke:#1688f0;stroke-width:1.5;stroke-dasharray:7 4;opacity:0;pointer-events:none;vector-effect:non-scaling-stroke}.show-hotspots .hotspot-outline{opacity:1}.canvas-svg [data-target]:hover>.hotspot-outline{opacity:1;fill:#1764ec08;stroke:#1764ec;stroke-dasharray:none}
    .viewer-footer{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin:20px auto 0;padding-top:14px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);line-height:1.65}.viewer-footer p{margin:0;max-width:730px}.footer-hint{white-space:nowrap;color:#75849b;font-size:10px}.footer-hint kbd{font-family:Arial,sans-serif;font-size:10px;padding:2px 5px;background:#fff;border:1px solid #d6deea;border-radius:3px;box-shadow:0 1px 0 #d6deea}.demo-pill{display:inline-block;background:#e1eafa;color:#345478;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.7px;padding:2px 5px;margin-right:5px;vertical-align:1px}.live-message{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:50;background:var(--navy);color:white;border-radius:8px;padding:11px 16px;font-size:12px;box-shadow:0 5px 20px #101e3540;max-width:calc(100% - 32px);text-align:center}.live-message:empty{display:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.error{padding:50px 24px;text-align:center;line-height:1.6}
    @media(max-width:1050px){.toolbar-inner{gap:12px}.brand{min-width:210px}.screen-picker{margin-left:auto}.screen-picker select{max-width:220px}.workspace{padding:20px 18px 26px}}
    @media(max-width:780px){.toolbar-inner{padding:12px 15px;gap:10px}.brand{flex:1}.brand-tag{font-size:9px}.device-tabs{order:3}.screen-picker{order:4;flex:1;justify-content:flex-end}.screen-picker label{display:none}.screen-picker select{width:100%;max-width:300px}.actions{gap:6px}.toolbar-action{padding:7px 9px}.workspace{padding:18px 12px 24px}.screen-meta{gap:8px}.meta-title{font-size:12px}.meta-caption{font-size:10px}.hotspots{font-size:10px;gap:5px}.viewer-footer{display:block;font-size:10px}.footer-hint{margin-top:10px}.canvas-shell[data-device="mobile"]{border-radius:24px}}
    @media(max-width:410px){.brand-name{font-size:12px}.brand{min-width:175px;gap:7px}.brand-symbol{height:30px;width:30px}.brand-tag{display:none}.device-tab{padding:8px}.device-tab svg{display:none}.screen-picker select{max-width:215px}.actions .toolbar-action{font-size:11px}.hotspots span{max-width:83px;white-space:normal}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
    @media print{.toolbar,.screen-meta,.viewer-footer,.live-message{display:none}body,.workspace{background:white;margin:0;padding:0}.canvas-shell,.canvas-shell[data-device="mobile"]{border:0;outline:none;box-shadow:none;border-radius:0;max-width:none!important}.hotspot-outline{display:none!important}}
  </style>
</head>
<body>
  <header class="toolbar" aria-label="Controles del prototipo">
    <div class="toolbar-inner">
      <div class="brand"><span class="brand-symbol" aria-hidden="true">C</span><span class="brand-name">Creativa Impresos</span><span class="brand-tag">Prototipo</span></div>
      <div class="device-tabs" role="group" aria-label="Tamaño de pantalla" id="device-tabs">
        <button class="device-tab" type="button" data-device="desktop" aria-pressed="true"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" aria-hidden="true"><rect x="2" y="2.5" width="16" height="11" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 14v3M6 17.5h8" stroke="currentColor" stroke-width="1.5"/></svg>Escritorio</button>
        <button class="device-tab" type="button" data-device="mobile" aria-pressed="false"><svg width="12" height="14" viewBox="0 0 16 20" fill="none" aria-hidden="true"><rect x="3.5" y="1" width="9" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 16h2" stroke="currentColor" stroke-width="1.5"/></svg>Móvil</button>
      </div>
      <div class="screen-picker"><label for="screen-select">Pantalla</label><select id="screen-select" aria-label="Ir a una pantalla del prototipo"></select></div>
      <div class="actions"><button type="button" class="toolbar-action" id="back-button" title="Volver a la pantalla anterior">← Atrás</button><button type="button" class="toolbar-action" id="restart-button" title="Volver al inicio del recorrido">Reiniciar</button></div>
    </div>
  </header>
  <main class="workspace">
    <div class="screen-meta"><div><h1 class="meta-title" id="screen-title">Prototipo Creativa</h1><div class="meta-caption" id="screen-caption"></div></div><label class="hotspots"><input id="hotspot-toggle" type="checkbox"><span>Mostrar zonas activas</span></label></div>
    <div class="canvas-shell" id="canvas-shell" aria-label="Pantalla de la tienda"></div>
    <footer class="viewer-footer"><p><span class="demo-pill">DEMOSTRACIÓN</span>Recorrido de compra simulado. Los productos, importes y plazos mostrados son ejemplos. Este prototipo no captura datos, procesa pagos ni genera pedidos reales.</p><div class="footer-hint"><kbd>Tab</kbd> para recorrer · <kbd>Enter</kbd> para abrir</div></footer>
  </main>
  <p class="sr-only" id="screen-announcement" aria-live="polite" aria-atomic="true"></p>
  <div class="live-message" id="live-message" role="status" aria-live="polite"></div>
  <script>
  'use strict';
  const DESIGN = /*__DESIGN__*/;
  (() => {
    const ns = 'http://www.w3.org/2000/svg';
    const screens = Array.isArray(DESIGN.screens) ? DESIGN.screens : [];
    const byId = new Map(screens.map(screen => [screen.id, screen]));
    const shell = document.getElementById('canvas-shell');
    const selector = document.getElementById('screen-select');
    const tabs = document.getElementById('device-tabs');
    const backButton = document.getElementById('back-button');
    const visited = [];
    let active = null;
    let internalHash = '';
    let toastTimer;
    const number = (value, fallback = 0) => Number.isFinite(Number(value)) ? Number(value) : fallback;
    const svgElement = (tag, attributes = {}) => {
      const element = document.createElementNS(ns, tag);
      Object.entries(attributes).forEach(([key, value]) => { if (value !== undefined && value !== null) element.setAttribute(key, String(value)); });
      return element;
    };
    const describeTarget = target => byId.has(target) ? `Ir a ${byId.get(target).name}` : 'Continuar el recorrido';
    const notify = text => {
      clearTimeout(toastTimer);
      document.getElementById('live-message').textContent = text;
      toastTimer = setTimeout(() => { document.getElementById('live-message').textContent = ''; }, 3200);
    };
    const isSafeImage = src => typeof src === 'string' && /^data:image\/(png|jpeg|webp);base64,/i.test(src);
    function renderNode(node) {
      const group = svgElement('g', {transform:`translate(${number(node.x)},${number(node.y)})`, opacity:node.opacity});
      const width = Math.max(0, number(node.w));
      const height = Math.max(0, number(node.h));
      const style = {fill:node.fill || 'none', stroke:node.stroke || 'none', 'stroke-width':number(node.strokeWidth, 1)};
      if (node.type === 'rect' || (node.type === 'group' && (node.fill || node.stroke))) {
        group.appendChild(svgElement('rect', {x:0,y:0,width,height,rx:Math.min(number(node.radius),width/2,height/2),...style}));
      } else if (node.type === 'ellipse') {
        group.appendChild(svgElement('ellipse', {cx:width/2,cy:height/2,rx:width/2,ry:height/2,...style}));
      } else if (node.type === 'image') {
        const source = DESIGN.assets && DESIGN.assets[node.asset];
        if (isSafeImage(source)) group.appendChild(svgElement('image', {href:source,x:0,y:0,width,height,preserveAspectRatio:'xMidYMid meet'}));
      } else if (node.type === 'text') {
        const fontSize = number(node.fontSize, 14);
        const lineHeight = number(node.lineHeight, fontSize * 1.2);
        const anchor = node.align === 'center' ? 'middle' : node.align === 'right' ? 'end' : 'start';
        const textX = node.align === 'center' ? width/2 : node.align === 'right' ? width : 0;
        const baseline = (lineHeight-fontSize)/2 + fontSize*.9;
        const text = svgElement('text', {x:textX,y:baseline,fill:node.color || node.fill || '#14243e','font-family':'Arial, sans-serif','font-size':fontSize,'font-weight':number(node.weight,400),'text-anchor':anchor,'xml:space':'preserve'});
        text.style.whiteSpace = 'pre';
        String(node.text ?? '').split(/\r?\n/).forEach((line, index) => {
          const tspan = svgElement('tspan', {x:textX,y:baseline+index*lineHeight});
          tspan.textContent = line || '\u00a0';
          text.appendChild(tspan);
        });
        group.appendChild(text);
      }
      if (Array.isArray(node.children)) node.children.forEach(child => group.appendChild(renderNode(child)));
      if (node.target) {
        group.dataset.target = node.target;
        group.setAttribute('role','link');
        group.setAttribute('tabindex','0');
        group.setAttribute('aria-label',`${node.name || 'Abrir'} · ${describeTarget(node.target)}`);
        const title = svgElement('title'); title.textContent = describeTarget(node.target); group.insertBefore(title,group.firstChild);
        const hitArea = svgElement('rect',{x:0,y:0,width,height,fill:'transparent','pointer-events':'all',rx:Math.max(2,number(node.radius))});
        group.appendChild(hitArea);
        group.appendChild(svgElement('rect',{class:'hotspot-outline',x:1,y:1,width:Math.max(0,width-2),height:Math.max(0,height-2),rx:Math.max(2,number(node.radius)),'aria-hidden':'true'}));
        const activate = event => { event.preventDefault();event.stopPropagation();navigate(node.target); };
        group.addEventListener('click',activate);
        group.addEventListener('keydown',event => {if(event.key==='Enter'||event.key===' ')activate(event);});
      }
      return group;
    }
    function screenDevice(screen) { return screen.device === 'mobile' ? 'mobile' : screen.device === 'desktop' ? 'desktop' : 'guide'; }
    function startFor(device) { return screens.find(screen => screenDevice(screen)===device && screen.flowStart) || screens.find(screen => screenDevice(screen)===device && /-inicio$/.test(screen.id)) || screens.find(screen => screenDevice(screen)===device) || screens[0]; }
    function setHash(id) {
      internalHash = `#${encodeURIComponent(id)}`;
      // Replacing the hash keeps browser history free of every prototype click.
      // The dedicated Atrás button preserves the complete visit history.
      try { history.replaceState(null,'',internalHash); } catch { location.hash = internalHash; }
    }
    function navigate(id, options={}) {
      const next=byId.get(id);
      if(!next){notify('Esta pantalla todavía no está disponible en el prototipo.');return;}
      if(active && active.id!==id && options.remember!==false)visited.push(active.id);
      active=next;
      const device=screenDevice(next);
      tabs.querySelectorAll('[data-device]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.device===device)));
      selector.replaceChildren();
      screens.filter(screen=>screenDevice(screen)===device).forEach(screen=>{
        const option=document.createElement('option');option.value=screen.id;option.textContent=screen.name;selector.appendChild(option);
      });
      selector.value=id;
      document.getElementById('screen-title').textContent=next.name;
      document.getElementById('screen-caption').textContent=`${device==='mobile'?'Vista móvil':device==='desktop'?'Vista de escritorio':'Guía del prototipo'} · ${next.width} × ${next.height} px · Haz clic en las acciones para explorar`;
      document.title=`${next.name} · Creativa Impresos`;
      shell.dataset.device=device;
      shell.style.maxWidth=`${device==='mobile'?Math.min(404,number(next.width,390)+14):number(next.width,1440)}px`;
      const canvas=svgElement('svg',{class:'canvas-svg',viewBox:`0 0 ${number(next.width,1440)} ${number(next.height,1000)}`,width:next.width,height:next.height,role:'group','aria-labelledby':'canvas-title canvas-description'});
      const title=svgElement('title',{id:'canvas-title'});title.textContent=next.name;canvas.appendChild(title);
      const description=svgElement('desc',{id:'canvas-description'});description.textContent='Pantalla de un prototipo de tienda virtual. Usa Tab y Enter o haz clic en las acciones para cambiar de pantalla. Los campos muestran datos de demostración.';canvas.appendChild(description);
      (next.nodes||[]).forEach(node=>canvas.appendChild(renderNode(node)));
      shell.replaceChildren(canvas);
      backButton.disabled=visited.length===0;
      document.getElementById('screen-announcement').textContent=`Pantalla: ${next.name}`;
      if(options.updateHash!==false)setHash(id);
      if(options.scroll!==false)window.scrollTo({top:0,behavior:'instant'});
    }
    selector.addEventListener('change',()=>navigate(selector.value));
    tabs.addEventListener('click',event=>{
      const button=event.target.closest('[data-device]');if(!button||!active)return;
      const device=button.dataset.device;
      if(screenDevice(active)===device)return;
      const prefix=device==='mobile'?'m-':'d-';
      const counterpart=byId.get(prefix+active.id.replace(/^[dm]-/,''));
      navigate(counterpart&&screenDevice(counterpart)===device?counterpart.id:startFor(device).id);
    });
    backButton.addEventListener('click',()=>{const id=visited.pop();if(id)navigate(id,{remember:false});});
    document.getElementById('restart-button').addEventListener('click',()=>{if(!active)return;visited.length=0;navigate(startFor(screenDevice(active)).id,{remember:false});notify('Recorrido reiniciado.');});
    document.getElementById('hotspot-toggle').addEventListener('change',event=>shell.classList.toggle('show-hotspots',event.target.checked));
    window.addEventListener('hashchange',()=>{
      if(location.hash===internalHash)return;
      let id;try{id=decodeURIComponent(location.hash.slice(1));}catch{return;}
      if(byId.has(id))navigate(id,{updateHash:false});
    });
    if(screens.some(screen=>screenDevice(screen)==='guide')){
      const guide=document.createElement('button');guide.type='button';guide.className='device-tab';guide.dataset.device='guide';guide.setAttribute('aria-pressed','false');guide.textContent='Guía';tabs.appendChild(guide);
    }
    ['desktop','mobile'].forEach(device=>{if(!screens.some(screen=>screenDevice(screen)===device)){const button=tabs.querySelector(`[data-device="${device}"]`);if(button)button.hidden=true;}});
    if(!screens.length){shell.innerHTML='<div class="error"><strong>No se encontraron pantallas.</strong><br>Abre la versión completa del prototipo que incluye los diseños.</div>';return;}
    let requested='';try{requested=decodeURIComponent(location.hash.slice(1));}catch{}
    navigate(byId.has(requested)?requested:byId.has(DESIGN.start)?DESIGN.start:screens[0].id,{remember:false,scroll:false});
  })();
  </script>
</body>
</html>
